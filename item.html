<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Applies saved appearance (font, color, background) before first paint — must stay first among *body-affecting* scripts, as a classic (non-module) script, to avoid a flash of default styling. Kept after charset+viewport so the browser commits to the mobile layout viewport before this blocking script runs, instead of briefly (or on some Android Chrome builds, persistently) treating the page as a non-mobile-optimized desktop-width page. -->
<script src="appearance-core.js"></script>
<title>Listing — VeusBid</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03010a">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="dark">
  <div class="bubble-field" aria-hidden="true">
    <span style="left:8%; width:16px; height:16px; animation-duration:6.5s;"></span>
    <span style="left:22%; width:10px; height:10px; animation-duration:8s; animation-delay:1s;"></span>
    <span style="left:71%; width:14px; height:14px; animation-duration:7s; animation-delay:.4s;"></span>
    <span style="left:88%; width:9px; height:9px; animation-duration:9s; animation-delay:2s;"></span>
  </div>
  <div class="shell">
    <div class="topbar">
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="browse.html" style="cursor:pointer;">Veus<em>Bid</em></a>
      <div class="topbar-actions">
        <div id="notif-mount" class="notif-mount"></div>
        <button id="logout-btn" class="btn ghost small" type="button">Log out</button>
      </div>
    </div>
    <div id="nav-mount"></div>

    <a href="browse.html" class="btn ghost small" style="margin-top:32px; display:inline-flex;">&larr; Back to Browse</a>

    <div id="item-root" style="margin-top:20px;"></div>
  </div>

  <script type="module" src="item.js"></script>
</body>
</html>
